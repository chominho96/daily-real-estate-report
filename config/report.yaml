timezone: "Asia/Seoul"
language: "ko"

llm:
  provider: "codex"
  model: "gpt-5-codex-mini"
  temperature: 0.2

news:
  provider: "naver"
  max_items: 12
  timeout_sec: 10
  naver_client_id_env: "NAVER_NEWS_CLIENT_ID"
  naver_client_secret_env: "NAVER_NEWS_CLIENT_SECRET"
  naver_sort: "date"
  queries:
    - "부동산 정책"
    - "주택담보대출 규제"
    - "주택 공급 대책"

# Own implementation: call public real-estate APIs directly.
# real-estate-mcp can be used only as reference for endpoint patterns and parameters.
real_estate_api:
  enabled: true
  base_url: "https://apis.data.go.kr"
  service_key_env: "MOLIT_API_SERVICE_KEY"
  timeout_sec: 20
  num_rows: 1000
  lawd_code_digits: 5
  endpoint_by_asset:
    apartment: "/1613000/RTMSDataSvcAptTrade/getRTMSDataSvcAptTrade"
    villa: "/1613000/RTMSDataSvcRHTrade/getRTMSDataSvcRHTrade"
    officetel: "/1613000/RTMSDataSvcOffiTrade/getRTMSDataSvcOffiTrade"

buyer_profile:
  monthly_net_income_manwon: 420.0
  monthly_saving_manwon: 180.0
  available_cash_manwon: 8000.0
  target_price_min_eok: 9.0
  target_price_max_eok: 12.0
  expected_ltv_pct: 70.0
  acquisition_cost_pct: 4.6
  loan_term_years: 30
  base_rate_pct: 4.3
  stress_rate_pct: 6.0
  affordability_threshold_pct: 35.0

sections:
  - id: "policy_news"
    title: "정책 뉴스"
    instruction: "정책/규제 뉴스 핵심을 요약하고 실수요자, 보유자, 투자자 관점의 영향까지 정리해줘."
  - id: "price_trend"
    title: "지역·자산군별 가격 추이"
    instruction: "관심 지역 아파트 가격/거래량 지표를 전일·전주 기준으로 설명해줘. 가격은 중앙값 기준이며 반드시 억 원 단위로 표현해줘."
  - id: "insights"
    title: "기타 인사이트"
    instruction: "이상 변동 지역, 거래량 변화, 해석 시 유의사항을 간결하게 정리해줘."
  - id: "buy_readiness"
    title: "매수 준비도"
    instruction: "예산/대출/월상환 관점에서 현재 매수 준비도를 판단하고, 필요한 준비 단계를 제안해줘."
  - id: "today_signal"
    title: "오늘의 한마디"
    instruction: "오늘의 시장 행동 신호를 적극매수/매수/관망/매도/적극매도 중 하나로 제시하고, 신뢰도와 근거를 함께 정리해줘."

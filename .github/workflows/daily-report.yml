name: Daily Real-Estate Report

on:
  schedule:
    # 22:00 UTC == 07:00 KST
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-real-estate-report"
  cancel-in-progress: false

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    outputs:
      report_path: ${{ steps.generate_report.outputs.report_path }}
      report_slug: ${{ steps.generate_report.outputs.report_slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Generate daily report
        id: generate_report
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_CLI_KEY || secrets.OPENAI_API_KEY }}
          MOLIT_API_SERVICE_KEY: ${{ secrets.MOLIT_API_SERVICE_KEY }}
          NAVER_NEWS_CLIENT_ID: ${{ secrets.NAVER_NEWS_CLIENT_ID }}
          NAVER_NEWS_CLIENT_SECRET: ${{ secrets.NAVER_NEWS_CLIENT_SECRET }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          LLM_DEBUG: ${{ vars.LLM_DEBUG }}
          LLM_STRICT: ${{ vars.LLM_STRICT }}
          LLM_CODEX_TIMEOUT_SEC: ${{ vars.LLM_CODEX_TIMEOUT_SEC }}
          REAL_ESTATE_API_DEBUG: ${{ vars.REAL_ESTATE_API_DEBUG }}
          REAL_ESTATE_API_STRICT: ${{ vars.REAL_ESTATE_API_STRICT }}
        run: |
          mkdir -p "$CODEX_HOME"
          REPORT_PATH=$(daily-report --root .)
          echo "report_path=${REPORT_PATH}" >> "$GITHUB_OUTPUT"

          REPORT_FILE=$(basename "$REPORT_PATH")
          REPORT_SLUG="${REPORT_FILE%.md}"
          echo "report_slug=${REPORT_SLUG}" >> "$GITHUB_OUTPUT"

      - name: Commit generated artifacts
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/reports docs/index.md state/last_run.json data/processed
            git commit -m "chore(report): daily report $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Build static site
        run: mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: generate-and-build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_SLUG: ${{ needs.generate-and-build.outputs.report_slug }}
        run: |
          NOW_KST=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')
          TODAY_KST=$(TZ=Asia/Seoul date '+%Y-%m-%d')
          BASE_URL="${PAGE_URL%/}/"
          REPORT_DAY="${REPORT_SLUG:0:10}"
          if [[ -z "$REPORT_DAY" ]]; then
            REPORT_DAY="$TODAY_KST"
          fi
          REPORT_URL="${BASE_URL}reports/${REPORT_DAY}/"

          payload=$(cat <<EOF
          {
            "content": "✅ 일일 부동산 시황 보고서가 생성되었습니다.",
            "embeds": [
              {
                "title": "보고서 보러가기",
                "url": "${REPORT_URL}",
                "description": "생성 시각(KST): ${NOW_KST}\n보고서 링크: ${REPORT_URL}",
                "color": 3066993
              }
            ]
          }
          EOF
          )

          curl -sS -H "Content-Type: application/json" -X POST -d "$payload" "$DISCORD_WEBHOOK_URL"

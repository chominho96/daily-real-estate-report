name: Daily Real-Estate Report

on:
  schedule:
    # 22:00 UTC == 07:00 KST
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "daily-real-estate-report"
  cancel-in-progress: false

jobs:
  generate-and-build:
    runs-on: ubuntu-latest
    outputs:
      report_path: ${{ steps.generate_report.outputs.report_path }}
      report_slug: ${{ steps.generate_report.outputs.report_slug }}
      health_status: ${{ steps.assess_health.outputs.health_status }}
      health_summary: ${{ steps.assess_health.outputs.health_summary }}
      health_cause: ${{ steps.assess_health.outputs.health_cause }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Generate daily report
        id: generate_report
        env:
          CODEX_CLI_KEY: ${{ secrets.CODEX_CLI_KEY }}
          MOLIT_API_SERVICE_KEY: ${{ secrets.MOLIT_API_SERVICE_KEY }}
          NAVER_NEWS_CLIENT_ID: ${{ secrets.NAVER_NEWS_CLIENT_ID }}
          NAVER_NEWS_CLIENT_SECRET: ${{ secrets.NAVER_NEWS_CLIENT_SECRET }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          LLM_DEBUG: ${{ vars.LLM_DEBUG }}
          LLM_STRICT: ${{ vars.LLM_STRICT }}
          LLM_CODEX_TIMEOUT_SEC: ${{ vars.LLM_CODEX_TIMEOUT_SEC }}
          REAL_ESTATE_API_DEBUG: ${{ vars.REAL_ESTATE_API_DEBUG }}
          REAL_ESTATE_API_STRICT: ${{ vars.REAL_ESTATE_API_STRICT }}
        run: |
          mkdir -p "$CODEX_HOME"
          if [[ -z "${CODEX_CLI_KEY}" ]]; then
            echo "CODEX_CLI_KEY secret is required (expected auth.json payload)." >&2
            exit 1
          fi
          printf '%s' "$CODEX_CLI_KEY" > "$CODEX_HOME/auth.json"
          chmod 600 "$CODEX_HOME/auth.json"
          REPORT_PATH=$(daily-report --root .)
          echo "report_path=${REPORT_PATH}" >> "$GITHUB_OUTPUT"

          REPORT_FILE=$(basename "$REPORT_PATH")
          REPORT_SLUG="${REPORT_FILE%.md}"
          echo "report_slug=${REPORT_SLUG}" >> "$GITHUB_OUTPUT"

      - name: Assess report health
        id: assess_health
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output_path = Path(os.environ["GITHUB_OUTPUT"])
          run_files = sorted(Path("data/processed").glob("run-*.json"), key=lambda p: p.stat().st_mtime, reverse=True)

          health_status = "warning"
          health_summary = "런 아티팩트를 찾지 못했습니다."
          health_cause = "리포트 생성 직후 파일 저장 실패 또는 경로 변경 가능성이 있습니다."

          if run_files:
              payload = json.loads(run_files[0].read_text(encoding="utf-8"))
              health = payload.get("health") or {}
              issues = list(health.get("issues") or [])

              if not issues:
                  health_status = str(health.get("status") or "ok")
                  health_summary = "치명적/주의 이슈가 감지되지 않았습니다."
                  health_cause = ""
              else:
                  severity_rank = {"critical": 3, "warning": 2, "info": 1}
                  issues.sort(key=lambda x: severity_rank.get(str(x.get("severity", "info")), 1), reverse=True)
                  top = issues[0]
                  health_status = str(health.get("status") or top.get("severity") or "warning")
                  health_summary = str(top.get("message") or "주의가 필요한 이슈가 감지되었습니다.")
                  health_cause = str(top.get("possible_cause") or "일시적 네트워크/인증 이슈일 수 있으니 로그 확인이 필요합니다.")

          health_summary = " ".join(health_summary.split())
          health_cause = " ".join(health_cause.split())

          with output_path.open("a", encoding="utf-8") as fh:
              fh.write(f"health_status={health_status}\n")
              fh.write(f"health_summary={health_summary}\n")
              fh.write(f"health_cause={health_cause}\n")
          PY

      - name: Commit generated artifacts
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/reports docs/index.md state/last_run.json data/processed
            git commit -m "chore(report): daily report $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Build static site
        run: mkdocs build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    runs-on: ubuntu-latest
    needs: generate-and-build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Notify Discord
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          REPORT_SLUG: ${{ needs.generate-and-build.outputs.report_slug }}
          HEALTH_STATUS: ${{ needs.generate-and-build.outputs.health_status }}
          HEALTH_SUMMARY: ${{ needs.generate-and-build.outputs.health_summary }}
          HEALTH_CAUSE: ${{ needs.generate-and-build.outputs.health_cause }}
        run: |
          NOW_KST=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M:%S')
          TODAY_KST=$(TZ=Asia/Seoul date '+%Y-%m-%d')
          BASE_URL="${PAGE_URL%/}/"
          REPORT_DAY="${REPORT_SLUG:0:10}"
          if [[ -z "$REPORT_DAY" ]]; then
            REPORT_DAY="$TODAY_KST"
          fi
          REPORT_URL="${BASE_URL}reports/${REPORT_DAY}/"
          export REPORT_URL NOW_KST
          python - <<'PY'
          import json
          import os
          import urllib.request

          report_url = os.environ["REPORT_URL"]
          now_kst = os.environ["NOW_KST"]
          health_status = (os.environ.get("HEALTH_STATUS") or "ok").strip().lower()
          health_summary = (os.environ.get("HEALTH_SUMMARY") or "").strip()
          health_cause = (os.environ.get("HEALTH_CAUSE") or "").strip()
          webhook_url = os.environ["DISCORD_WEBHOOK_URL"]

          color = 3066993
          content = "✅ 일일 부동산 시황 보고서가 생성되었습니다."
          fields = []
          if health_status in {"warning", "critical"}:
              content = "⚠️ 일일 부동산 시황 보고서가 생성되었지만 점검 이슈가 있습니다."
              color = 15105570 if health_status == "warning" else 15158332
              fields.append(
                  {
                      "name": "참고 메시지",
                      "value": health_summary or "주의 이슈가 감지되었습니다.",
                      "inline": False,
                  }
              )
              fields.append(
                  {
                      "name": "가능 원인(간단)",
                      "value": health_cause or "일시적 네트워크/인증/응답 지연 이슈일 수 있습니다.",
                      "inline": False,
                  }
              )

          payload = {
              "content": content,
              "embeds": [
                  {
                      "title": "보고서 보러가기",
                      "url": report_url,
                      "description": f"생성 시각(KST): {now_kst}\n보고서 링크: {report_url}",
                      "color": color,
                      "fields": fields,
                  }
              ],
          }

          body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
          req = urllib.request.Request(
              webhook_url,
              data=body,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=15) as resp:
              resp.read()
          PY

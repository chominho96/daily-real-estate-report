name: Report Preview (No Deploy)

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: "report-preview-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  preview-report:
    if: github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    outputs:
      report_path: ${{ steps.generate_report.outputs.report_path }}
      report_slug: ${{ steps.generate_report.outputs.report_slug }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Generate daily report (preview)
        id: generate_report
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MOLIT_API_SERVICE_KEY: ${{ secrets.MOLIT_API_SERVICE_KEY }}
          NAVER_NEWS_CLIENT_ID: ${{ secrets.NAVER_NEWS_CLIENT_ID }}
          NAVER_NEWS_CLIENT_SECRET: ${{ secrets.NAVER_NEWS_CLIENT_SECRET }}
          LLM_DEBUG: ${{ vars.LLM_DEBUG }}
          LLM_STRICT: ${{ vars.LLM_STRICT }}
          REAL_ESTATE_API_DEBUG: ${{ vars.REAL_ESTATE_API_DEBUG }}
          REAL_ESTATE_API_STRICT: ${{ vars.REAL_ESTATE_API_STRICT }}
        run: |
          REPORT_PATH=$(daily-report --root .)
          echo "report_path=${REPORT_PATH}" >> "$GITHUB_OUTPUT"

          REPORT_FILE=$(basename "$REPORT_PATH")
          REPORT_SLUG="${REPORT_FILE%.md}"
          echo "report_slug=${REPORT_SLUG}" >> "$GITHUB_OUTPUT"

      - name: Build static site (preview)
        run: mkdocs build

      - name: Write run summary
        run: |
          {
            echo "## Report Preview"
            echo ""
            echo "- ref: \`${GITHUB_REF}\`"
            echo "- report path: \`${{ steps.generate_report.outputs.report_path }}\`"
            echo "- report slug: \`${{ steps.generate_report.outputs.report_slug }}\`"
            echo ""
            echo "Artifacts:"
            echo "- preview-data-${GITHUB_RUN_ID}"
            echo "- preview-site-${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview data artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-data-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: |
            docs/reports/*.md
            docs/index.md
            data/processed/run-*.json
            state/last_run.json

      - name: Upload preview site artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-site-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: site
